# nginx site for Lush AI Music Studio on the web server `lushvietnix2` (since 2026-11-16).
# Install:  /etc/nginx/sites-available/lush-studio.conf  ->  symlink into sites-enabled
#
# Domain: suno.darkambient.co, PROXIED through Cloudflare (orange cloud). The server firewall only accepts
# 80/443 from Cloudflare's address ranges, so a DNS-only record cannot reach it and Let's Encrypt HTTP
# validation is not possible. TLS between Cloudflare and this server uses the Cloudflare Origin certificate
# of darkambient.co (wildcard, valid until 2041): /etc/ssl/cloudflare/darkambient.co.{pem,key}.
#
# The real visitor address comes from /etc/nginx/snippets/cloudflare-realip.conf, which the other site on
# this server (app.lushmedia.net) already includes at http level. Do not include it a second time here:
# nginx rejects a duplicate `real_ip_header`. Without it the login rate limit would count Cloudflare's
# addresses instead of visitors.
#
# lush-api listens on 127.0.0.1:8018 (BIND_ADDR in /etc/lush/api.env) and serves the React app itself.

limit_req_zone $binary_remote_addr zone=lush_studio_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name suno.darkambient.co;

    return 301 https://suno.darkambient.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name suno.darkambient.co;

    ssl_certificate /etc/ssl/cloudflare/darkambient.co.pem;
    ssl_certificate_key /etc/ssl/cloudflare/darkambient.co.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Render nodes never come through the public site; they use the private listener below.
    location /api/worker/ {
        return 403;
    }

    location = /api/v1/auth/login {
        limit_req zone=lush_studio_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
    }

    # Reference Audio / Source Audio uploads. Keep a little above MAX_INPUT_AUDIO_MB (50) so the API,
    # not nginx, answers an oversized file with a readable error. (Cloudflare's own limit is 100 MB.)
    location = /api/v1/audio-inputs {
        client_max_body_size 60m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Audio streaming and Range requests.
        proxy_buffering off;
    }
}

# Private listener for render nodes over Tailscale (this server's tailnet IP: 100.96.4.9).
# Workers use CONTROL_PLANE_URL=http://100.96.4.9:8081 (traffic is already encrypted by WireGuard).
# It listens on every interface on purpose: binding to the Tailscale IP would make nginx fail to start
# (taking the other sites on this server down with it) whenever nginx comes up before tailscaled.
# Access is limited to the Tailscale address range here, and the firewall must allow the port on the
# Tailscale interface only:  ufw allow in on tailscale0 to any port 8081 proto tcp
server {
    listen 8081;
    server_name _;

    allow 100.64.0.0/10;
    deny all;

    client_max_body_size 600m;

    location /api/worker/ {
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
    }

    location / {
        return 403;
    }
}
