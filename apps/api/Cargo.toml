[package]
name = "lush-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
hex = "0.4.3"
mime = "0.3.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "json", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "v7"] }
zip = { version = "9.5.1", default-features = false }

[dev-dependencies]
http-body-util = "0.1.5"

[lib]
name = "lush_api"
path = "src/lib.rs"

[[bin]]
name = "lush-api"
path = "src/main.rs"

# argon2 is unusably slow unoptimised; keep dev/test logins fast.
[profile.dev.package.argon2]
opt-level = 3
