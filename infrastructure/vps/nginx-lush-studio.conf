# nginx site for Lush AI Music Studio. The VPS already runs nginx for other sites, so Caddy is not used.
# Install:  /etc/nginx/sites-available/lush-studio.conf  ->  symlink into sites-enabled
# Domain: suno.darkambient.co (DNS-only record straight to the VPS, so a Let's Encrypt certificate is used,
# not the Cloudflare origin certificate of darkambient.co). Certificate, same webroot method as the other sites:
#   certbot certonly --webroot -w /var/www/letsencrypt -d suno.darkambient.co
# The old name studio.darkambient.co (used until 2026-11-11) only redirects to the new one.
# lush-api listens on 127.0.0.1:8018 (BIND_ADDR in /etc/lush/api.env) and serves the React app itself.

limit_req_zone $binary_remote_addr zone=lush_studio_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name suno.darkambient.co studio.darkambient.co;

    # Certificate issuance and renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://suno.darkambient.co$request_uri;
    }
}

# Old name: redirect only (its certificate keeps renewing while this block exists).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.darkambient.co;

    ssl_certificate /etc/letsencrypt/live/studio.darkambient.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.darkambient.co/privkey.pem;

    return 301 https://suno.darkambient.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name suno.darkambient.co;

    ssl_certificate /etc/letsencrypt/live/suno.darkambient.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suno.darkambient.co/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Render nodes never come through the public site; they use the private listener below.
    location /api/worker/ {
        return 403;
    }

    location = /api/v1/auth/login {
        limit_req zone=lush_studio_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Audio streaming and Range requests.
        proxy_buffering off;
    }
}

# Private listener for render nodes over Tailscale (VPS tailnet IP 100.113.164.7).
# Workers use CONTROL_PLANE_URL=http://100.113.164.7:8081 (traffic is already encrypted by WireGuard).
# It listens on every interface on purpose: binding to the Tailscale IP would make nginx fail to start
# (taking every other site on this VPS down with it) whenever nginx comes up before tailscaled.
# Access is limited to the Tailscale address range instead.
server {
    listen 8081;
    server_name _;

    allow 100.64.0.0/10;
    deny all;

    client_max_body_size 600m;

    location /api/worker/ {
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8018;
        include proxy_params;
    }

    location / {
        return 403;
    }
}
